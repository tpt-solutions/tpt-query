# cargo-deny policy. Run by .github/workflows/ci.yml.

[licenses]
# Only these licenses are accepted. Everything else fails the check.
allow = [
    "MIT",
    "Apache-2.0",
    # Required by unicode-ident (transitive via proc-macro2), which is
    # "(MIT OR Apache-2.0) AND Unicode-3.0". OSI-approved permissive license.
    "Unicode-3.0",
]
confidence-threshold = 0.9

[sources]
# The only git dependency is the pinned tpt-testkit dev-dependency.
allow-git = ["https://github.com/tpt-solutions/tpt-testkit"]
