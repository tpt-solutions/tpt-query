name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown, thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli matching Cargo.lock
        run: |
          version=$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | sed -n 's/.*"\(.*\)"/\1/p')
          cargo install -f wasm-bindgen-cli --version "$version"
      - name: Run the project checks
        run: bash scripts/ci.sh
      - name: Docs with warnings denied
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - run: cargo install cargo-audit --locked && cargo audit
